resources:
  jobs:
    medallion_job:
      name: medallion-orders
      description: Synthetic orders pipeline from bronze through gold
      max_concurrent_runs: 1

      tasks:
        - task_key: bronze_orders
          timeout_seconds: 1200
          max_retries: 0
          notebook_task:
            notebook_path: ../src/medallion/01_bronze_orders.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: silver_orders
          depends_on:
            - task_key: bronze_orders
          timeout_seconds: 1200
          max_retries: 0
          notebook_task:
            notebook_path: ../src/medallion/02_silver_orders.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: gold_daily_sales
          depends_on:
            - task_key: silver_orders
          timeout_seconds: 1200
          max_retries: 0
          notebook_task:
            notebook_path: ../src/medallion/03_gold_daily_sales.py
            base_parameters:
              catalog: ${var.catalog}

      permissions:
        - group_name: data-engineers
          level: CAN_MANAGE_RUN
        - group_name: data-analysts
          level: CAN_VIEW
