name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-format:
    name: Terraform format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure

  terraform-validate:
    name: Terraform validate (${{ matrix.root }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root: [azure, databricks-account, databricks-workspace]
    defaults:
      run:
        working-directory: infrastructure/${{ matrix.root }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Install locked providers without a state backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate Terraform configuration
        run: terraform validate -no-color

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Compile notebooks without executing Spark or dbutils
        run: python -m compileall -q src/medallion scripts tests

  deployment-tests:
    name: Deployment tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: databricks/setup-cli@9b64c94a6d2b2e830592d80e9f14c26d32b42ad7
        with:
          version: 1.20.0
      - name: Install schema validation tools
        run: python -m pip install -r requirements-ci.txt
      - name: Check bundle YAML against the pinned CLI schema
        run: python scripts/check_bundle_schema.py
      - name: Test deployment guards and failure propagation without cloud access
        env:
          DATABRICKS_CLI_TEST_BIN: databricks
        run: python -m unittest discover -s tests -v

  shell-syntax:
    name: Shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check lifecycle script syntax without running the scripts
        run: |
          bash -n scripts/terraform-up.sh
          bash -n scripts/terraform-down.sh
