name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      smoke_test:
        type: boolean
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Bundle deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
      DATABRICKS_RUN_AS_CLIENT_ID: ${{ vars.DATABRICKS_RUN_AS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Every environment gets the same event SHA, even if main advances.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Name the pinned checkout for bundle branch validation
        run: git checkout -B main "$GITHUB_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check environment settings before authentication
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python - <<'PY'
          import os
          from scripts.deploy_bundle import deployment_environment
          deployment_environment(os.environ["DEPLOY_ENVIRONMENT"], os.environ)
          PY
      - uses: databricks/setup-cli@9b64c94a6d2b2e830592d80e9f14c26d32b42ad7
        with:
          version: 1.20.0
      - name: Validate, deploy and optionally test
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SMOKE_TEST: ${{ inputs.smoke_test }}
        run: |
          args=("$DEPLOY_ENVIRONMENT")
          if [ "$SMOKE_TEST" = "true" ]; then
            args+=(--smoke-test)
          fi
          python scripts/deploy_bundle.py "${args[@]}"
      - name: Record deployment evidence
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          SMOKE_TEST: ${{ inputs.smoke_test }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Databricks deployment"
            echo "Environment: $DEPLOY_ENVIRONMENT"
            echo "Commit: $RELEASE_SHA"
            echo "Pipeline executed successfully: $SMOKE_TEST"
          } >> "$GITHUB_STEP_SUMMARY"
